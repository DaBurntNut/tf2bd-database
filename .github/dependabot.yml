# Dependabot updates SHA-pinned actions and their release annotations.
# Runtime scripts use only the standard library; CI tools are pinned in the workflow.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Group action pins into one weekly review.
    groups:
      github-actions:
        patterns:
          - "*"
