# Dependabot updates full-SHA action pins and their trailing release annotations.
# It understands the `uses: owner/action@<sha> # vX.Y.Z` format.
# Scripts use only the standard library; CI tool versions are pinned in the workflow.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      # Reads as "ci: bump actions/checkout from v7.0.0 to v7.0.1".
      prefix: "ci"
    # One pull request per week for all of them, not one per action: these are
    # pins in a single file, and reviewing them together is the point.
    groups:
      github-actions:
        patterns:
          - "*"
