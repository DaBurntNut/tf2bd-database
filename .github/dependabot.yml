# Dependabot updates SHA-pinned actions and their release annotations, and the
# CI check tooling pinned in pyproject.toml.
# Runtime scripts use only the standard library, so nothing here ships to users.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Group action pins into one weekly review.
    groups:
      github-actions:
        patterns:
          - "*"

  # Without this entry the five tool pins have no owner and rot silently: the
  # workflow installs exact versions, so nothing would ever propose a newer one.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One pull request per week for the whole toolchain, not five.
    groups:
      check-tools:
        patterns:
          - "*"
