name: Sync Vorobey hackerpolice

# Promote eligible matches; demote snapshot-confirmed removals only, preserving manually added cheaters.
# Keep upstream evidence in the report, never in the database.
# Advance the byte-exact snapshot only when safe.
# Read-only checks gate the write-capable sync job.
# PR creation needs the Actions PR setting or BOT_TOKEN with contents/pull-requests write access.
# If PR creation fails, the fallback pushes a branch and adds a compare link.
# Pin actions to commit SHAs; Dependabot updates the pins and release annotations.

on:
  schedule:
    # Nominally 05:23 UTC, off the busy top of the hour. GitHub queues scheduled
    # jobs, and how long it queues them is a property of the repository rather
    # than of this line: over two weeks in November 2026 two repositories running
    # this exact expression started a median of 0.9 and 8.5 hours late. Read it as
    # "once a day", never as a clock; nothing here depends on the time of day.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should happen when entries need updating?"
        type: choice
        options:
          - pull-request
          - commit
        default: pull-request
      dry_run:
        description: "Report the changes without updating the database or snapshot or opening a pull request"
        type: boolean
        default: false
      allow_mass_demotion:
        description: "Demote even if a large share of the snapshot disappeared upstream (e.g. after a long absence)"
        type: boolean
        default: false

  # Run PR checks when files used by the sync or its tests change.
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".gitattributes"
      - ".gitignore"
      - "playerlist.garou3299.json"
      # playerlist.scammers.json is not listed: the sync never reads or writes
      # it and no test checks it, so an edit there has nothing to verify.
      - "rules.garou3299.json"
      - "snapshot/playerlist.vorobey-hackerpolice.json"
      # Tests read the Dependabot config and this workflow; include each in this filter.
      # README.md is not listed: no test reads it, so prose edits need no checks.
      - ".github/dependabot.yml"
      - ".github/workflows/sync-vorobey-hackerpolice.yml"

# Least privilege by default: no job may read or write more than its own block.
permissions: {}

jobs:
  # Read-only checks gate publishing and run without write credentials.
  checks:
    name: ${{ github.event_name == 'pull_request' && 'Lint and test the proposed change' || 'Lint and test before publishing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Report both matrix results even if one leg fails.
      fail-fast: false
      matrix:
        # Test the documented minimum (3.10) and production runtime (3.12).
        python-version: ["3.10", "3.12"]
    # Isolate checks from sync and cancel stale runs without canceling sibling Python legs.
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}-py${{ matrix.python-version }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tests need no GitHub credentials; do not persist checkout credentials for tools.
          persist-credentials: false
          # The checks need the working tree only, not the whole history.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned check tooling
        # Versions live in pyproject.toml's [dependency-groups] so Dependabot
        # can track them; installing once gives every step identical tooling.
        # pip only learned --group in 25.1 and setup-python can ship an older
        # one, so raise pip first -- without this the install fails with
        # "no such option: --group".
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --upgrade "pip>=25.1"
          python3 -m pip install --quiet --disable-pip-version-check --group ci

      - name: Lint (ruff)
        run: |
          python3 -m ruff check scripts tests
          python3 -m ruff format --check scripts tests

      - name: Type-check (mypy, strict)
        run: python3 -m mypy scripts

      - name: Security scan (bandit)
        run: python3 -m bandit -q -r scripts

      - name: Run unit tests under the coverage gate
        # The floor is fail_under in pyproject.toml (95%), not 100%: the suite
        # reaches 100% today, but the gate must not demand a test for a branch
        # that cannot be reached.
        run: |
          python3 -X warn_default_encoding -W error::EncodingWarning -m coverage run -m unittest discover -s tests -v
          python3 -m coverage report

      - name: No test may depend on the clock standing still
        # Second pass with the displayed clock advancing on every read. A test
        # that renders the same run twice and compares the results otherwise
        # passes unless the minute ticks between them: a failure that shows up
        # once in a few thousand runs and reproduces for nobody. Here it fails
        # every time instead. See _tick_the_clock_on_every_read in
        # tests/_support.py; a failure below is fixed with frozen_clock().
        env:
          TF2BD_TICKING_CLOCK: "1"
        run: python3 -m unittest discover -s tests -q

      - name: Dead code (vulture)
        run: python3 -m vulture scripts tests --min-confidence 60

  sync:
    name: Check Vorobey hackerpolice list
    needs: checks
    # Only the default-branch workflow may run the write-capable sync job.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents:write is required to read the default branch AND push the bot branch.
      contents: write
      # pull-requests:write is required to open/close the bot pull request.
      pull-requests: write
      issues: none
    # Serialize sync writers without blocking pull-request checks.
    concurrency:
      group: sync-vorobey-hackerpolice
      cancel-in-progress: false
    env:
      DATABASE: playerlist.garou3299.json
      SNAPSHOT: snapshot/playerlist.vorobey-hackerpolice.json
      BOT_BRANCH: bot/vorobey-hackerpolice-sync
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      # Scheduled runs always use pull-request mode; manual runs select the mode.
      MODE: ${{ github.event_name == 'schedule' && 'pull-request' || inputs.mode }}
      # Empty on scheduled runs, so cleanup compares a string rather than null.
      DRY_RUN_INPUT: ${{ inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always check out the default branch; manual dispatch may start from another ref.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sync database with Vorobey hackerpolice list
        id: sync
        # Runtime sync uses only the Python standard library.
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ALLOW_MASS_DEMOTION: ${{ inputs.allow_mass_demotion && '--allow-mass-demotion' || '' }}
        run: |
          # Expand optional flags unquoted so empty values contribute no argument.
          # shellcheck disable=SC2086
          python3 scripts/sync_vorobey_hackerpolice.py \
            --database "$DATABASE" \
            --snapshot "$SNAPSHOT" \
            --report "$RUNNER_TEMP/hackerpolice-sync-report.md" \
            $DRY_RUN \
            $ALLOW_MASS_DEMOTION \
            --demote

      - name: Show report in the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hackerpolice-sync-report.md" ]; then
            cat "$RUNNER_TEMP/hackerpolice-sync-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update pull request
        id: pr
        # A failed automatic PR attempt is handled by the fallback step below.
        continue-on-error: true
        # Publish only after sync succeeds and reports changes.
        if: steps.sync.outcome == 'success' && steps.sync.outputs.changed == 'true' && env.MODE != 'commit'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          add-paths: |
            ${{ env.DATABASE }}
            ${{ env.SNAPSHOT }}
          branch: ${{ env.BOT_BRANCH }}
          # Always target the configured default branch.
          base: ${{ env.BASE_BRANCH }}
          delete-branch: true
          title: "Sync the Vorobey hackerpolice matches"
          commit-message: |
            Sync the Vorobey hackerpolice matches

            Auto-generated by .github/workflows/sync-vorobey-hackerpolice.yml
          body-path: ${{ runner.temp }}/hackerpolice-sync-report.md

      - name: Push branch and link a manual pull request
        if: steps.sync.outcome == 'success' && steps.sync.outputs.changed == 'true' && env.MODE != 'commit' && steps.pr.outcome == 'failure'
        env:
          # Pass expressions through the environment instead of interpolating them into shell.
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check the worktree, not only the branch ref; the action may already have committed changes.
          if [ -n "$(git status --porcelain -- "$DATABASE" "$SNAPSHOT")" ]; then
            git checkout -B "$BOT_BRANCH"
            git add -- "$DATABASE" "$SNAPSHOT"
            git commit -m "Sync the Vorobey hackerpolice matches"
          fi
          if ! git rev-parse --verify --quiet "refs/heads/$BOT_BRANCH" > /dev/null; then
            echo "::error::Nothing was committed to $BOT_BRANCH and no such branch exists - nothing to push."
            exit 1
          fi
          # Fetch the bot ref explicitly and derive its lease; checkout fetches only the default branch.
          expected=''
          if git fetch --quiet origin "+refs/heads/$BOT_BRANCH:refs/remotes/origin/$BOT_BRANCH" 2>/dev/null; then
            expected=$(git rev-parse --verify "refs/remotes/origin/$BOT_BRANCH")
          fi
          # An empty lease requires the remote branch to be absent, so failed fetches cannot authorize overwrites.
          git push --force-with-lease="refs/heads/$BOT_BRANCH:$expected" --set-upstream origin "$BOT_BRANCH"

          compare_url="https://github.com/$REPOSITORY/compare/$BASE_BRANCH...$BOT_BRANCH?expand=1"
          {
            echo ""
            echo "### Pull request could not be created automatically"
            echo ""
            echo "The branch \`$BOT_BRANCH\` was pushed, but this repository does not allow"
            echo "\`GITHUB_TOKEN\` to open pull requests."
            echo ""
            echo "**Option 1:** open the pull request with one click: $compare_url"
            echo ""
            echo "**Option 2:** enable *Settings → Actions → General → Workflow permissions →"
            echo "Allow GitHub Actions to create and approve pull requests* so future runs"
            echo "open the pull request on their own."
            echo ""
            echo "**Option 3:** add a personal access token (contents + pull requests: write)"
            echo "as the \`BOT_TOKEN\` repository secret; it is used instead of \`GITHUB_TOKEN\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit directly to the default branch
        id: direct_commit
        if: steps.sync.outcome == 'success' && steps.sync.outputs.changed == 'true' && env.MODE == 'commit'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATABASE" "$SNAPSHOT"
          git commit -m "Sync the Vorobey hackerpolice matches"
          git push

      - name: Nothing to do
        if: steps.sync.outcome == 'success' && steps.sync.outputs.changed != 'true'
        run: echo "Nothing to publish (no database or snapshot changes, or this was a dry run)."

      - name: Close a stale bot pull request
        # A later sync can stale an unmerged bot PR; merging it could undo newer upstream state or manual fixes.
        if: steps.sync.outcome == 'success' && env.DRY_RUN_INPUT != 'true' && (steps.sync.outputs.changed != 'true' || (env.MODE == 'commit' && steps.direct_commit.outcome == 'success'))
        # Keep cleanup best-effort; permission failures must not fail a successful sync.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --repo "$REPOSITORY" --head "$BOT_BRANCH" --state open --json number --jq '.[].number')
          for number in $numbers; do
            gh pr close "$number" --repo "$REPOSITORY" --delete-branch \
              --comment "Closing: the latest successful sync superseded this pull request. A new one is opened automatically the next time the list changes."
            echo "Closed stale bot pull request #$number." >> "$GITHUB_STEP_SUMMARY"
          done
