# Tooling only; scripts run on Python 3.10+. Ruff is used locally and in CI.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (the report uses arrows on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["playerlist", "sources", "policy", "report", "sync_vorobey_hackerpolice"]

# The scripts are imported as top-level modules (scripts/ is on sys.path in
# tests and in the workflow), so tell type checkers where to find them.
[tool.pyright]
include = ["scripts"]
extraPaths = ["scripts"]

[tool.mypy]
# Strict on the shipped code: it is five small modules, and the bot runs
# unattended, so a type error is worth failing a pull request over.
strict = true
mypy_path = "scripts"

[tool.coverage.run]
# Branch coverage, not just lines: a branch nobody takes (the error path of a
# guard) is exactly the code this bot runs when something has gone wrong, so
# "every line ran" is not good enough.
branch = true
source = ["scripts"]

[tool.coverage.report]
# The gate itself. `coverage report` exits non-zero below this, so CI fails
# on an untested statement or branch instead of on a reviewer noticing.
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
]
