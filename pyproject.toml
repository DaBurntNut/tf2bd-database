# Tooling config only. The scripts run on the ONE Python version the workflow
# pins (PYTHON_VERSION in .github/workflows/sync-vorobey-hackerpolice.yml).
# ruff's target-version below tracks that number as a floor -- see the note
# above it before changing either.

# Versions of the tools configured below, so a tool's settings and its version
# live in one file. Dependabot owns this table (see .github/dependabot.yml) and
# proposes bumps weekly; each one has to pass these same checks before merging.
# Not runtime dependencies -- the sync scripts use only the standard library.
[dependency-groups]
ci = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "coverage==7.17.5",
    "vulture==2.16",
]

[tool.ruff]
line-length = 120
# The formatting FLOOR: the oldest Python this source must stay parseable by.
# Not a runtime setting -- PYTHON_VERSION in the sync workflow decides what
# actually executes. The monthly version check never edits this line.
#
# Keep this at or BELOW PYTHON_VERSION, never above. Below is harmless: ruff
# merely withholds newer-syntax rewrites. Above is a live bug -- ruff and the
# formatter would approve syntax the runtime cannot parse, so every check here
# could pass while the bot died on import.
#
# At py314 the formatter writes PEP 758's ``except A, B:`` in two files
# (sources.py, sync_vorobey_hackerpolice.py). No Python below 3.14 can parse
# that, which is intended: the bot targets 3.14+ and CI runs only 3.14. Rolling
# a future bump BACK (3.15 -> 3.14) is unaffected. Dropping PYTHON_VERSION below
# 3.14 is the one move that now needs those two lines parenthesized again first.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (the report uses arrows on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["playerlist", "sources", "policy", "report", "sync_vorobey_hackerpolice", "python_version_check"]

# mypy is the type checker CI runs; a second, unenforced config would only drift.
[tool.mypy]
# Strictly type-check the small, unattended runtime.
strict = true
mypy_path = "scripts"

[tool.coverage.run]
# Require branch coverage; failure paths are especially important for the bot.
branch = true
source = ["scripts"]

[tool.coverage.report]
# Keep coverage honest without demanding the impossible last few percent. The
# suite currently sits at 100%; the floor exists so it cannot silently rot, not
# so a contributor has to invent a test for an unreachable branch to pass CI.
#
# Read that 100% as "every line ran at least once", NOT as "every behavior is
# checked". Two gaps it cannot see:
#   * a conditional expression (``a if cond else b``) is one line with no
#     branch arcs, so coverage reports it fully covered with one side never
#     executed. There are 65 of them in scripts/. One -- the line that adds a
#     missing trailing newline to the report -- had never run in any test
#     while this file reported 100%.
#   * running a line is not the same as asserting on what it did. A test can
#     execute a limit check and never notice the limit itself changing.
# Mutation testing is what finds both; coverage is a floor, not a verdict.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
]
