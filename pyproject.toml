# Tooling config only; runtime scripts support Python 3.10+.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (the report uses arrows on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["playerlist", "sources", "policy", "report", "sync_vorobey_hackerpolice"]

# mypy is the type checker CI runs; a second, unenforced config would only drift.
[tool.mypy]
# Strictly type-check the small, unattended runtime.
strict = true
mypy_path = "scripts"

[tool.coverage.run]
# Require branch coverage; failure paths are especially important for the bot.
branch = true
source = ["scripts"]

[tool.coverage.report]
# Fail CI when any statement or branch is untested.
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
]
